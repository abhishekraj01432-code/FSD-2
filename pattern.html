<!DOCTYPE html>
<html lang="en">        
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOC</title>
    <head>                      
</head>
<body>  
    <script>
        for(var i=1;i<=5;i++){
            var str="";
            for(var j=1;j<=i;j++){
                str+=j;
            }
            for(var k=i-1;k>=1;k--){
                str+=k;
            }
            document.write(str+"<br>");
        }
    </script>   
</html>
